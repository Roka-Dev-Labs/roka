name: Publish roka-mcp to npm

# Triggers:
#   - Push a tag matching roka-mcp-v* (e.g. roka-mcp-v0.1.1) to publish that version.
#   - Or run manually via workflow_dispatch for a one-off/backfill publish.
#
# Requires a repository secret named NPM_TOKEN (an npm "Automation" access token
# with publish rights for the roka-mcp package). Add it under
# Settings -> Secrets and variables -> Actions -> New repository secret.

on:
  push:
    tags:
      - "roka-mcp-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag to publish under (e.g. latest, next)"
        required: false
        default: "latest"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roka-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/roka-mcp-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#roka-mcp-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --tag "${{ github.event.inputs.tag || 'latest' }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
