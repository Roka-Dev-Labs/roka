name: Publish roka-mcp to npm

# Triggers:
#   - Push a tag matching roka-mcp-v* (e.g. roka-mcp-v0.1.1) to publish that version.
#   - Or run manually via workflow_dispatch for a one-off/backfill publish.
#
# Requires a repository secret named NPM_TOKEN:
#   1. Create a Granular Access Token at https://www.npmjs.com/settings/~/tokens
#      (Read and write + Bypass 2FA + All packages, or scoped to roka-mcp)
#   2. Add it under Settings → Secrets and variables → Actions → New repository secret
#      Name: NPM_TOKEN   Value: npm_...

on:
  push:
    tags:
      - "roka-mcp-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag to publish under (e.g. latest, next)"
        required: false
        default: "latest"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roka-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          # Write auth into the package dir so npm publish (cwd=roka-mcp) finds it.
          scope: ""

      - name: Ensure NPM_TOKEN is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Repository secret NPM_TOKEN is missing or empty."
            echo "Create a Granular Access Token (Read and write + Bypass 2FA) at"
            echo "https://www.npmjs.com/settings/~/tokens"
            echo "then add it as Actions secret NPM_TOKEN:"
            echo "https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

      - name: Write npm auth for package directory
        working-directory: .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # setup-node writes .npmrc at repo root; also write one inside roka-mcp/
          # so publish with working-directory=roka-mcp always has auth.
          cat > roka-mcp/.npmrc <<EOF
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          registry=https://registry.npmjs.org/
          always-auth=true
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/roka-mcp-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#roka-mcp-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ github.event.inputs.tag || 'latest' }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "roka-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "roka-mcp@${VERSION} is already on npm — skipping publish."
            # Keep the dist-tag pointed at this version when re-running a tag build.
            npm dist-tag add "roka-mcp@${VERSION}" "${DIST_TAG}" || true
            exit 0
          fi
          npm publish --access public --tag "${DIST_TAG}"
