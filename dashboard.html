<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Roka</title>
    
    <!-- Updated Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Roka" />
    <link rel="manifest" href="/site.webmanifest" />

    <script src="/js/config.js"></script>
    <link href="https://api.fontshare.com/v2/css?f[]=plein@300,400,500,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --text: #0a0a0a;
            --text-muted: #666666;
            --border: #e5e5e5;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.1);
            --surface: #f5f5f5;
        }

        html.dark {
            --bg: #0a0a0a;
            --text: #ededed;
            --text-muted: #888888;
            --border: #262626;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --surface: #171717;
        }

        body {
            font-family: 'Plein', system-ui, sans-serif;
            font-weight: 300;
            letter-spacing: -0.01em;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            color: var(--text);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        .nav-links a.active {
            color: var(--text);
            font-weight: 500;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 6px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            color: var(--text);
            border-color: var(--text);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .dashboard-header {
            margin-bottom: 2rem;
        }

        .dashboard-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .dashboard-header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .tier-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            background: var(--accent);
            color: white;
        }

        .tier-badge.free {
            background: var(--border);
            color: var(--text);
        }

        .tier-badge.pro {
            background: var(--accent);
            color: white;
        }

        .tier-badge.trial {
            background: #f59e0b;
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border);
        }

        .stat-card h3 {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .stat-card .subtext {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .trial-countdown {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .trial-countdown h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .trial-countdown .days {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .trial-countdown .subtext {
            font-size: 0.875rem;
            opacity: 0.9;
        }

        .quick-actions {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        @keyframes logoSpin {
            0% { transform: rotate(0deg) scale(1); opacity: 0; }
            50% { transform: rotate(180deg) scale(1.2); opacity: 1; }
            100% { transform: rotate(360deg) scale(1); opacity: 1; }
        }

        .logo-animate {
            animation: logoSpin 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="/index.html" class="nav-logo">
            <img src="/favicon-32x32.png" alt="" class="logo-animate" width="28" height="28">
            Roka
        </a>
        <div class="nav-links">
            <a href="/dashboard.html" class="active">Dashboard</a>
            <a href="/dashboard/api-keys.html">API Keys</a>
            <a href="/dashboard/upgrade.html">Upgrade</a>
            <button id="themeToggle" type="button" class="btn-secondary" aria-label="Toggle theme">
                <span id="themeLabel">Light</span>
            </button>
            <button id="logoutBtn" class="btn-secondary">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-header">
            <h1>Welcome back, <span id="userName">User</span></h1>
            <p>Current Tier: <span id="tierBadge" class="tier-badge">Loading...</span></p>
        </div>

        <div id="trialCountdown" class="trial-countdown hidden">
            <h3>Your trial expires in</h3>
            <div class="days"><span id="daysRemaining">0</span> days</div>
            <div class="subtext">Upgrade to Pro to keep using Roka</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Tokens This Month</h3>
                <div class="value"><span id="tokensUsed">0</span> / <span id="tokensLimit">0</span></div>
                <div class="progress-bar">
                    <div class="progress-fill" id="tokenProgress" style="width: 0%"></div>
                </div>
                <div class="subtext"><span id="tokensRemaining">0</span> remaining</div>
            </div>

            <div class="stat-card">
                <h3>API Calls This Month</h3>
                <div class="value" id="apiCalls">0</div>
                <div class="subtext">Total requests</div>
            </div>

            <div class="stat-card">
                <h3>Average Compression</h3>
                <div class="value" id="avgCompression">0%</div>
                <div class="subtext">Token reduction</div>
            </div>
        </div>

        <div class="quick-actions">
            <a href="/dashboard/api-keys.html" class="btn-primary">Manage API Keys</a>
            <a href="/dashboard/upgrade.html" class="btn-primary" id="upgradeBtn">Upgrade to Pro</a>
        </div>
    </div>

    <script>
        const html = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const themeLabel = document.getElementById('themeLabel');

        function applyTheme(theme) {
            if (theme === 'dark') {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
            themeLabel.textContent = theme === 'dark' ? 'Dark' : 'Light';
            localStorage.setItem('roka-theme', theme);
        }

        const savedTheme = localStorage.getItem('roka-theme') || 'light';
        applyTheme(savedTheme);

        themeToggle.addEventListener('click', () => {
            const newTheme = html.classList.contains('dark') ? 'light' : 'dark';
            applyTheme(newTheme);
        });

        const API_BASE = window.ROKA_API_BASE || 'https://api.roka-prune.com';
        let accessToken = localStorage.getItem('roka_access_token');

        async function loadDashboard() {
            if (!accessToken) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });

                if (!response.ok) {
                    window.location.href = '/login.html';
                    return;
                }

                const user = await response.json();
                document.getElementById('userName').textContent = user.email.split('@')[0];
                
                const tierBadge = document.getElementById('tierBadge');
                tierBadge.textContent = user.tier.toUpperCase();
                tierBadge.className = 'tier-badge ' + user.tier;

                if (user.is_trial_active && user.trial_ends_at) {
                    const trialEnds = new Date(user.trial_ends_at);
                    const now = new Date();
                    const daysLeft = Math.ceil((trialEnds - now) / (1000 * 60 * 60 * 24));
                    
                    if (daysLeft > 0) {
                        document.getElementById('trialCountdown').classList.remove('hidden');
                        document.getElementById('daysRemaining').textContent = daysLeft;
                    }
                }

                loadTokenUsage();

            } catch (error) {
                console.error('Error loading dashboard:', error);
                window.location.href = '/login.html';
            }
        }

        async function loadTokenUsage() {
            const keysResponse = await fetch(`${API_BASE}/api-keys`, {
                headers: {
                    'Authorization': `Bearer ${accessToken}`
                }
            });

                if (keysResponse.ok) {
                    const keys = await keysResponse.json();
                    if (keys.length > 0) {
                        const statusResponse = await fetch(`${API_BASE}/api/status`, {
                        headers: {
                            'Authorization': `Bearer ${keys[0].key}`
                        }
                    });

                    if (statusResponse.ok) {
                        const status = await statusResponse.json();
                        document.getElementById('tokensUsed').textContent = status.tokens_used_this_month.toLocaleString();
                        document.getElementById('tokensLimit').textContent = status.tokens_limit.toLocaleString();
                        document.getElementById('tokensRemaining').textContent = status.tokens_remaining.toLocaleString();
                        
                        const progress = (status.tokens_used_this_month / status.tokens_limit) * 100;
                        document.getElementById('tokenProgress').style.width = `${Math.min(progress, 100)}%`;
                    }
                }
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('roka_access_token');
            window.location.href = '/index.html';
        });

        loadDashboard();
    </script>
</body>
</html>
