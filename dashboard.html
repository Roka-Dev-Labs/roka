<body class="dash-body">

            <img src="/assets/logos/logo-roka.png" alt="Roka" width="28" height="28">
            Roka

        <div class="dash-nav-links">
            <a href="/dashboard.html" class="active">Under the hood</a>
            <a href="/dashboard/api-keys.html" id="navKeys">API keys</a>
            <a href="/docs/mcp.html">MCP</a>
        </div>
        <div class="dash-nav-actions">
            <div class="nav-action-pills">
                <a href="/login.html" id="navLoginBtn" class="nav-login-btn"><span class="inner">Sign up</span></a>
                <button id="themeToggle" type="button" class="theme-toggle-btn" aria-label="Switch to light mode">
                    <span class="inner">
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                            <circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.5"/>
                            <path id="themeIconFill" d="M6 1 A5 5 0 0 0 6 11 Z" fill="currentColor"/>
                        </svg>

    <main class="dash-wrap">
        <section id="accountStrip" class="dash-account" aria-live="polite">
            <div class="surface dash-stat">
                <div class="k">Account</div>
                <div class="v" id="acctName">—</div>
                <div class="s" id="acctTier">signed in</div>
            </div>
            <div class="surface dash-stat">
                <div class="k">Tokens this month</div>
                <div class="v" id="acctUsed">—</div>
                <div class="s" id="acctLimit"></div>
            </div>
            <div class="surface dash-stat">
                <div class="k">Remaining</div>
                <div class="v" id="acctLeft">—</div>
                <div class="s">hosted API quota</div>
            </div>
            <div class="surface dash-stat">
                <div class="k">MCP</div>
                <div class="v" id="acctMcp">—</div>
                <div class="s">key status for connect / serve</div>
            </div>

                · <a href="/docs/mcp.html">Connect</a>

            </span>

    <script type="module">
        import { mountHood } from "/assets/js/hood-ui.js?v=hood2";
        mountHood(document.getElementById("hood"));
        document.querySelectorAll(".reveal").forEach((el) => el.classList.add("visible"));
    </script>
    <script src="/assets/js/reveal.js" defer></script>
    <script>
        (function () {
            const html = document.documentElement;
            const themeToggle = document.getElementById("themeToggle");
            const themeLabel = document.getElementById("themeLabel");
            const themeIconFill = document.getElementById("themeIconFill");

            function applyTheme(theme) {
                html.dataset.theme = theme;
                html.classList.toggle("dark", theme === "dark");
                html.classList.toggle("light", theme === "light");
                html.style.colorScheme = theme;
                themeLabel.textContent = theme === "dark" ? "Light" : "Dark";
                if (themeIconFill) {
                    themeIconFill.setAttribute(
                        "d",
                        theme === "dark" ? "M6 1 A5 5 0 0 0 6 11 Z" : "M6 1 A5 5 0 0 1 6 11 Z"
                    );
                }
                themeToggle.setAttribute(
                    "aria-label",
                    theme === "dark" ? "Switch to light mode" : "Switch to dark mode"
                );
                localStorage.setItem("roka-theme", theme);
                localStorage.setItem("theme", theme);
            }

            applyTheme(localStorage.getItem("roka-theme") === "light" ? "light" : "dark");
            themeToggle.addEventListener("click", () => {
                applyTheme(html.dataset.theme === "dark" ? "light" : "dark");
            });

            const token = localStorage.getItem("roka_access_token");
            const loginBtn = document.getElementById("navLoginBtn");
            if (token) {
                const label = loginBtn.querySelector(".inner");
                if (label) label.textContent = "Account";
                loginBtn.href = "/dashboard.html";
                loginBtn.addEventListener("click", (event) => {
                    if (event.metaKey || event.ctrlKey) return;
                    event.preventDefault();
                    localStorage.removeItem("roka_access_token");
                    window.location.href = "/index.html";
                });
                loginBtn.title = "Log out";
                label.textContent = "Log out";
            }

            async function loadAccount() {
                if (!token) return;
                const API_BASE = window.ROKA_API_BASE || "https://api.roka-prune.com";
                try {
                    const meRes = await fetch(`${API_BASE}/auth/me`, {
                        headers: { Authorization: `Bearer ${token}` },
                    });
                    if (!meRes.ok) return;
                    const user = await meRes.json();
                    document.getElementById("accountStrip").classList.add("is-on");
                    document.getElementById("acctName").textContent =
                        user.first_name || (user.email || "").split("@")[0] || "signed in";
                    document.getElementById("acctTier").textContent = user.tier || "free";

                    const keysRes = await fetch(`${API_BASE}/api-keys`, {
                        headers: { Authorization: `Bearer ${token}` },
                    });
                    if (!keysRes.ok) return;
                    const keys = await keysRes.json();
                    if (!keys.length) {
                        document.getElementById("acctMcp").textContent = "no key";
                        document.getElementById("acctUsed").textContent = "—";
                        document.getElementById("acctLeft").textContent = "create a key";
                        return;
                    }
                    const statusRes = await fetch(`${API_BASE}/api/status`, {
                        headers: { Authorization: `Bearer ${keys[0].key}` },
                    });
                    if (!statusRes.ok) return;
                    const status = await statusRes.json();
                    document.getElementById("acctUsed").textContent =
                        Number(status.tokens_used_this_month || 0).toLocaleString();
                    document.getElementById("acctLimit").textContent =
                        `of ${Number(status.tokens_limit || 0).toLocaleString()}`;
                    document.getElementById("acctLeft").textContent =
                        Number(status.tokens_remaining || 0).toLocaleString();
                    document.getElementById("acctMcp").textContent = status.mcp_allowed ? "allowed" : "locked";
                } catch (err) {
                    console.error(err);
                }
            }
            loadAccount();
        })();
    </script>
</body>
</html>
