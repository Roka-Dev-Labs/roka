    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #000000;
            --card: #141414;
            --text: #ffffff;
            --text-muted: #a1a1a1;
            --border: #2e2e2e;
            --input: #1a1a1a;
            --accent: #ffffff;
        }

        html { color-scheme: dark; }

        body {
            font-family: "Montserrat", sans-serif;
            font-optical-sizing: auto;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.55s ease, transform 0.55s ease;
        }

        .login-container.ready {
            opacity: 1;
            transform: translateY(0);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 2rem 1.75rem 1.5rem;
        }

        .card-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 1.25rem;
        }

        .card-logo img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .card h1 {
            font-size: 1.45rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.03em;
            line-height: 1.2;
        }

        .card .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            margin: 0.45rem 0 1.5rem;
        }

        .oauth-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.7rem;
            margin-bottom: 1.15rem;
        }

        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            min-height: 46px;
            padding: 0.7rem 0.85rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #1c1c1c;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .oauth-btn:hover { border-color: #555; background: #222; }

        .oauth-btn svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .oauth-divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 1.15rem;
        }

        .oauth-divider::before,
        .oauth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .form-group { margin-bottom: 0.9rem; }

        .form-group label {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            font-size: 0.86rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

        .form-group label .optional {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.78rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.78rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--input);
            color: var(--text);
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .form-group input::placeholder { color: #6b6b6b; font-weight: 500; }

        .form-group input:focus {
            outline: none;
            border-color: #6b6b6b;
        }

        .name-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.7rem;
        }

        .password-wrap { position: relative; }

        .password-wrap input { padding-right: 2.75rem; }

        .password-toggle {
            position: absolute;
            right: 0.55rem;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .password-toggle:hover { color: var(--text); }

        .password-toggle svg { width: 18px; height: 18px; }

        .signup-fields {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            margin-top: 0;
            transition: grid-template-rows 0.38s ease, opacity 0.28s ease, margin 0.38s ease;
        }

        html[data-mode="signup"] .signup-fields {
            grid-template-rows: 1fr;
            opacity: 1;
            margin-top: 0;
        }

        .signup-fields-inner { overflow: hidden; }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            width: 100%;
            min-height: 46px;
            margin-top: 0.55rem;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 0.8rem 1.25rem;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            transition: opacity 0.2s ease, transform 0.15s ease;
        }

        .btn-primary:hover { opacity: 0.92; }
        .btn-primary:active { transform: translateY(1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary .arrow { font-size: 1.05rem; line-height: 1; }

        .toggle-link {
            text-align: center;
            margin-top: 1.15rem;
            font-size: 0.86rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .toggle-link a {
            color: var(--text);
            font-weight: 800;
            text-decoration: none;
        }

        .toggle-link a:hover { text-decoration: underline; }

        .error {
            background: rgba(220, 38, 38, 0.16);
            color: #fca5a5;
            padding: 0.7rem 0.85rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.84rem;
            font-weight: 600;
            text-align: center;
        }

        .hidden { display: none; }

        .welcome-splash {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.6rem;
            opacity: 1;
            transition: opacity 0.22s ease;
        }

        .welcome-splash.fade {
            opacity: 0;
            pointer-events: none;
        }

        .welcome-splash.hidden { display: none; }

        .welcome-logo {
            width: 148px;
            height: 148px;
            object-fit: contain;
            animation: welcomeSpin 1.35s linear infinite;
        }

        .welcome-splash h1 {
            color: #fff;
            font-size: clamp(1.75rem, 4.5vw, 2.25rem);
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        @keyframes welcomeSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .welcome-logo { animation: none; }
            .login-container,
            .signup-fields,
            .welcome-splash { transition: none; }
        }

        @media (max-width: 420px) {
            .name-row, .oauth-row { grid-template-columns: 1fr; }
            .card { padding: 1.5rem 1.15rem 1.25rem; }
        }
    </style>
</head>
<body>
    <div class="welcome-splash hidden" id="welcomeSplash" aria-hidden="true">
        <img src="/assets/logos/logo-roka.png" alt="" class="welcome-logo" width="148" height="148">
        <h1>Welcome!</h1>
    </div>

    <div class="login-container" id="loginContainer">
        <div class="card">
            <a href="/" class="card-logo" aria-label="Roka home">
                <img src="/assets/logos/logo-roka.png" alt="Roka" width="36" height="36">
            </a>
            <h1 id="formTitle">Sign in</h1>
            <p class="subtitle" id="formSubtitle">Welcome back to Roka</p>

            <div id="error" class="error hidden"></div>

            <div class="oauth-row">
                <a class="oauth-btn" id="githubOAuth" href="#">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.757-1.333-1.757-1.09-.745.083-.73.083-.73 1.205.085 1.84 1.237 1.84 1.237 1.07 1.835 2.809 1.305 3.495.998.108-.776.418-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.468-2.381 1.236-3.221-.123-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.5 11.5 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.29-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.61-2.807 5.625-5.479 5.921.43.372.823 1.102.823 2.222 0 1.606-.015 2.896-.015 3.286 0 .322.216.694.825.576C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                    GitHub
                </a>
                <a class="oauth-btn" id="googleOAuth" href="#">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Google
                </a>
            </div>
            <div class="oauth-divider">or</div>

            <form id="authForm">
                <div class="signup-fields" id="signupFields">
                    <div class="signup-fields-inner">
                        <div class="name-row">
                            <div class="form-group">
                                <label for="firstName">First name</label>
                                <input type="text" id="firstName" name="first_name" autocomplete="given-name" placeholder="First name">
                            </div>
                            <div class="form-group">
                                <label for="lastName">Surname</label>
                                <input type="text" id="lastName" name="last_name" autocomplete="family-name" placeholder="Surname">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" name="username" autocomplete="username" placeholder="Username">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" required autocomplete="email" placeholder="Enter your email">
                </div>

                <div class="signup-fields">
                    <div class="signup-fields-inner">
                        <div class="form-group">
                            <label for="phone">Phone number <span class="optional">(Optional)</span></label>
                            <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="Enter your phone number">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" required autocomplete="current-password" placeholder="Enter your password" minlength="8">
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
                            <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg id="eyeClosed" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a17.3 17.3 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a17.4 17.4 0 0 1-3.16 4.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">Continue <span class="arrow" aria-hidden="true">▸</span></button>
            </form>

            <div class="toggle-link">
                <span id="toggleText">Don't have an account? </span>
                <a href="?mode=signup" id="toggleLink">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.ROKA_API_BASE || 'https://api.roka-prune.com';
        let isLoginMode = true;

        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const submitBtn = document.getElementById('submitBtn');
        const toggleText = document.getElementById('toggleText');
        const toggleLink = document.getElementById('toggleLink');
        const errorDiv = document.getElementById('error');
        const welcomeSplash = document.getElementById('welcomeSplash');
        const loginContainer = document.getElementById('loginContainer');
        const signupInputs = ['firstName', 'lastName', 'username'].map((id) => document.getElementById(id));
        const passwordInput = document.getElementById('password');
        const params = new URLSearchParams(window.location.search);
        const nextParam = params.get('next') || '';
        const safeNext = (nextParam.startsWith('/') && !nextParam.startsWith('//') && !nextParam.includes('\\'))
            ? nextParam
            : '/dashboard.html';

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function oauthUrl(provider) {
            const query = new URLSearchParams({ next: safeNext });
            return `${API_BASE}/auth/oauth/${provider}?${query.toString()}`;
        }

        document.getElementById('githubOAuth').href = oauthUrl('github');
        document.getElementById('googleOAuth').href = oauthUrl('google');

        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const oauthToken = hashParams.get('token') || params.get('token');
        const oauthError = params.get('error');
        if (oauthError) {
            showError(oauthError);
            history.replaceState(null, '', window.location.pathname + (nextParam ? `?next=${encodeURIComponent(nextParam)}` : ''));
        }
        if (oauthToken) {
            localStorage.setItem('roka_access_token', oauthToken);
            window.location.replace(safeNext);
        }

        function applyMode(animate) {
            document.documentElement.dataset.mode = isLoginMode ? 'login' : 'signup';
            formTitle.textContent = isLoginMode ? 'Sign in' : 'Create your account';
            formSubtitle.textContent = isLoginMode
                ? 'Welcome back to Roka'
                : 'Welcome! Please fill in the details to get started.';
            toggleText.textContent = isLoginMode ? "Don't have an account? " : 'Already have an account? ';
            toggleLink.textContent = isLoginMode ? 'Sign up' : 'Sign in';
            toggleLink.setAttribute('href', isLoginMode ? '?mode=signup' : '?mode=login');
            passwordInput.autocomplete = isLoginMode ? 'current-password' : 'new-password';
            signupInputs.forEach((input) => {
                input.required = !isLoginMode;
            });
            if (!animate) return;
            formTitle.style.opacity = '0';
            formSubtitle.style.opacity = '0';
            requestAnimationFrame(() => {
                formTitle.style.transition = 'opacity 0.28s ease';
                formSubtitle.style.transition = 'opacity 0.28s ease';
                formTitle.style.opacity = '1';
                formSubtitle.style.opacity = '1';
            });
        }

        function toggleMode(nextIsLogin) {
            isLoginMode = nextIsLogin;
            applyMode(true);
            if (!oauthError) errorDiv.classList.add('hidden');
            const next = new URLSearchParams(window.location.search);
            if (isLoginMode) next.delete('mode');
            else next.set('mode', 'signup');
            const qs = next.toString();
            history.replaceState(null, '', window.location.pathname + (qs ? `?${qs}` : ''));
        }

        if (params.get('mode') === 'signup') {
            isLoginMode = false;
        }
        applyMode(false);

        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            toggleMode(!isLoginMode);
        });

        document.getElementById('togglePassword').addEventListener('click', () => {
            const show = passwordInput.type === 'password';
            passwordInput.type = show ? 'text' : 'password';
            document.getElementById('eyeOpen').classList.toggle('hidden', show);
            document.getElementById('eyeClosed').classList.toggle('hidden', !show);
            document.getElementById('togglePassword').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;
            submitBtn.disabled = true;
            errorDiv.classList.add('hidden');

            try {
                const endpoint = isLoginMode ? '/auth/login' : '/auth/signup';
                const payload = { email, password };
                if (!isLoginMode) {
                    payload.first_name = document.getElementById('firstName').value.trim();
                    payload.last_name = document.getElementById('lastName').value.trim();
                    payload.username = document.getElementById('username').value.trim();
                    payload.phone = document.getElementById('phone').value.trim();
                }
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const raw = await response.text();
                let data;
                try {
                    data = JSON.parse(raw);
                } catch {
                    throw new Error(raw.trim() || `Server error (${response.status})`);
                }

                if (!response.ok) {
                    throw new Error(data.detail || data.error || 'Authentication failed');
                }

                localStorage.setItem('roka_access_token', data.access_token);
                const next = new URLSearchParams(window.location.search).get('next') || '';
                window.location.href = (next.startsWith('/') && !next.startsWith('//') && !next.includes('\\'))
                    ? next
                    : '/dashboard.html';

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
            }
        });

        function revealForm() {
            loginContainer.classList.add('ready');
        }

        function playWelcome() {
            const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            welcomeSplash.classList.remove('hidden');
            welcomeSplash.setAttribute('aria-hidden', 'false');
            const hold = 700;
            const fade = 220;
            setTimeout(() => {
                welcomeSplash.classList.add('fade');
                revealForm();
                setTimeout(() => {
                    welcomeSplash.classList.add('hidden');
                    welcomeSplash.setAttribute('aria-hidden', 'true');
                }, fade);
            }, hold);
        }

        if (!oauthToken) {
            const wantsWelcome = params.get('welcome') === '1' || params.get('from') === 'nav';
            if (wantsWelcome) {
                const clean = new URLSearchParams(params);
                clean.delete('welcome');
                clean.delete('from');
                const qs = clean.toString();
                history.replaceState(null, '', window.location.pathname + (qs ? `?${qs}` : '') + window.location.hash);
                playWelcome();
            } else {
                revealForm();
            }
        }
    </script>
</body>
</html>
