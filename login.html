    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
            --text-muted: #6e6e73;
            --border: #d2d2d7;
            --input: #f5f5f7;
            --accent: #1d1d1f;
            --signal: #1d1d1f;
        }

        html {
            font-size: 112.5%;
            color-scheme: light;
        }

        body {
            font-family: "Montserrat", sans-serif;
            font-optical-sizing: auto;
            font-weight: 375;
            font-style: normal;
            letter-spacing: -0.01em;
            line-height: 1.65;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
        }

        @view-transition {
            navigation: auto;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            animation: loginIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes loginIn {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 2rem 1.75rem 1.5rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
        }

        .card-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 1.35rem;
        }

        .card-logo img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            filter: brightness(0);
        }

        .card h1 {
            font-size: 1.45rem;
            font-weight: 500;
            text-align: center;
            letter-spacing: -0.03em;
            line-height: 1.2;
        }

        .card .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 375;
            text-align: center;
            margin: 0.45rem 0 1.5rem;
        }

        .oauth-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.7rem;
            margin-bottom: 1.15rem;
        }

        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            min-height: 46px;
            padding: 0.7rem 0.85rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #ffffff;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .oauth-btn:hover { border-color: #aeaeb2; background: #f5f5f7; }

        .oauth-btn svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .oauth-divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 1.15rem;
        }

        .oauth-divider::before,
        .oauth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .form-group { margin-bottom: 0.9rem; }

        .form-group label {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            font-size: 0.86rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
        }

        .form-group label .req {
            color: #e11d48;
            font-weight: 600;
            margin-left: 0.18em;
        }

        .form-group label .optional {
            color: var(--text-muted);
            font-weight: 375;
            font-size: 0.78rem;
        }

        .field-hint {
            display: none;
            color: #b42318;
            font-size: 0.75rem;
            font-weight: 450;
            margin: -0.12rem 0 0.38rem;
            line-height: 1.35;
        }

        .form-group.invalid .field-hint { display: block; }

        .form-group.invalid input {
            border-color: #e8b4ae;
            background: #fff1f0;
        }

        .form-group.invalid input:focus {
            border-color: #e11d48;
            box-shadow: inset 0 0 0 1px #e11d48;
        }

        .form-group input {
            width: 100%;
            padding: 0.78rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--input);
            color: var(--text);
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 375;
        }

        .form-group input::placeholder { color: #8e8e93; font-weight: 375; }

        .form-group input:focus {
            outline: none;
            border-color: #1d1d1f;
            background: #ffffff;
            box-shadow: inset 0 0 0 1px #1d1d1f;
        }

        .name-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.7rem;
        }

        .password-wrap { position: relative; }

        .password-wrap input { padding-right: 2.75rem; }

        .password-toggle {
            position: absolute;
            right: 0.55rem;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .password-toggle:hover { color: var(--text); }

        .password-toggle svg { width: 18px; height: 18px; }

        .signup-fields {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            margin-top: 0;
            transition: grid-template-rows 0.38s ease, opacity 0.28s ease, margin 0.38s ease;
        }

        html[data-mode="signup"] .signup-fields {
            grid-template-rows: 1fr;
            opacity: 1;
            margin-top: 0;
        }

        .signup-fields-inner { overflow: hidden; }
        html[data-mode="signup"] .signup-fields-inner { overflow: visible; }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            width: 100%;
            min-height: 46px;
            margin-top: 0.55rem;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 0.8rem 1.25rem;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            transition: opacity 0.2s ease, transform 0.15s ease;
        }

        .btn-primary:hover { opacity: 0.92; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary .arrow { font-size: 1.05rem; line-height: 1; }

        .toggle-link {
            text-align: center;
            margin-top: 1.15rem;
            font-size: 0.86rem;
            font-weight: 375;
            color: var(--text-muted);
        }

        .toggle-link a {
            color: var(--text);
            font-weight: 500;
            text-decoration: none;
        }

        .toggle-link a:hover { text-decoration: underline; }

        .error {
            background: #fff1f0;
            color: #b42318;
            padding: 0.7rem 0.85rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.84rem;
            font-weight: 375;
            text-align: center;
        }

        .hidden { display: none; }

        .card {
            position: relative;
            overflow: visible;
            transition: min-height 0.45s cubic-bezier(0.22, 1, 0.36, 1), padding 0.45s ease;
        }

        .auth-form-body {
            transform-origin: center top;
            transition: opacity 0.38s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .card.is-busy {
            overflow: hidden;
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 2.5rem;
            padding-bottom: 2.5rem;
        }

        .card.is-busy .auth-form-body {
            position: absolute;
            inset: 0;
            opacity: 0;
            transform: scale(0.72);
            pointer-events: none;
        }

        .auth-result {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.1rem;
            text-align: center;
            min-height: 220px;
            width: 100%;
        }

        .card.is-busy .auth-result { display: flex; }

        .auth-mark {
            width: 96px;
            height: 96px;
            position: relative;
        }

        .auth-ring {
            position: absolute;
            inset: 12px;
            border: 4px solid #ececef;
            border-top-color: #1d1d1f;
            border-radius: 50%;
            animation: auth-spin 0.7s linear infinite;
        }

        .auth-check-svg {
            position: absolute;
            inset: 0;
            width: 96px;
            height: 96px;
            opacity: 0;
        }

        .auth-track {
            fill: none;
            stroke: #ececef;
            stroke-width: 4;
        }

        .auth-check {
            fill: none;
            stroke: #1d1d1f;
            stroke-width: 4.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 52;
            stroke-dashoffset: 52;
        }

        .card.is-done .auth-ring {
            animation: none;
            opacity: 0;
        }

        .card.is-done .auth-check-svg { opacity: 1; }

        .card.is-done .auth-check {
            animation: auth-check 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .auth-result-label {
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: var(--text);
            min-height: 1.4em;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .card.is-done .auth-result-label {
            opacity: 1;
            transform: none;
        }

        @keyframes auth-spin {
            to { transform: rotate(360deg); }
        }

        @keyframes auth-check {
            to { stroke-dashoffset: 0; }
        }

        html[data-auth="pending"] .auth-form-body { visibility: hidden; }

        @media (prefers-reduced-motion: reduce) {
            .login-container { animation: none; }
            .signup-fields { transition: none; }
            .auth-form-body, .auth-result-label { transition: none; }
            .auth-ring, .card.is-done .auth-check { animation: none; }
            .auth-ring { border-top-color: #ececef; }
            .auth-check { stroke-dashoffset: 0; }
            .card.is-done .auth-result-label { opacity: 1; transform: none; }
        }

        @media (max-width: 420px) {
            .name-row, .oauth-row { grid-template-columns: 1fr; }
            .card { padding: 1.5rem 1.15rem 1.25rem; }
        }
    </style>
    <link rel="stylesheet" href="/assets/css/press.css?v=theme4">
    <style>
        /* Buttons spring on press. Fields stay full width so their edges are not clipped. */
        @media (prefers-reduced-motion: no-preference) {
            .login-container .oauth-btn,
            .login-container .btn-primary:not(:disabled),
            .login-container .toggle-link a {
                transform: scale(1);
                transform-origin: center;
                transition-property: transform, opacity, background-color, border-color, color, box-shadow;
                transition-duration: 0.42s, 0.2s, 0.2s, 0.2s, 0.2s, 0.2s;
                transition-timing-function:
                    linear(0, 0.218 2.1%, 0.862 12.3%, 1.114 20.5%, 1.114 22.7%, 1.011 32.6%, 0.977 38.4%, 0.989 44.5%, 1.001 52.3%, 1),
                    ease, ease, ease, ease, ease;
            }
            .login-container .form-group input {
                transform: none;
                transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            }
            @media (hover: hover) and (pointer: fine) {
                .login-container .oauth-btn:hover,
                .login-container .btn-primary:not(:disabled):hover,
                .login-container .toggle-link a:hover {
                    transform: scale(1.02);
                }
            }
            .login-container .oauth-btn:active,
            .login-container .btn-primary:not(:disabled):active,
            .login-container .toggle-link a:active {
                transform: scale(0.96);
            }
            .login-container .form-group input:active {
                background: #ececef;
            }
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <div class="card" id="authCard">
            <div class="auth-form-body" id="authFormBody">
            <a href="/" class="card-logo" aria-label="Roka home">
                <img src="/assets/logos/logo-roka.png" alt="Roka" width="64" height="64">
            </a>
            <h1 id="formTitle">Create your account</h1>
            <p class="subtitle" id="formSubtitle">Welcome! Please fill in the details to get started.</p>

            <div id="error" class="error hidden"></div>

            <div class="oauth-row">
                <a class="oauth-btn" id="githubOAuth" href="#">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.757-1.333-1.757-1.09-.745.083-.73.083-.73 1.205.085 1.84 1.237 1.84 1.237 1.07 1.835 2.809 1.305 3.495.998.108-.776.418-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.468-2.381 1.236-3.221-.123-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.5 11.5 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.29-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.61-2.807 5.625-5.479 5.921.43.372.823 1.102.823 2.222 0 1.606-.015 2.896-.015 3.286 0 .322.216.694.825.576C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                    GitHub
                </a>
                <a class="oauth-btn" id="googleOAuth" href="#">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Google
                </a>
            </div>
            <div class="oauth-divider">or</div>

            <form id="authForm" novalidate>
                <div class="signup-fields" id="signupFields">
                    <div class="signup-fields-inner">
                        <div class="name-row">
                            <div class="form-group">
                                <label for="firstName">First name <span class="req" aria-hidden="true">*</span></label>
                                <p class="field-hint" data-for="firstName">This field is required.</p>
                                <input type="text" id="firstName" name="first_name" autocomplete="given-name" placeholder="First name">
                            </div>
                            <div class="form-group">
                                <label for="lastName">Surname <span class="req" aria-hidden="true">*</span></label>
                                <p class="field-hint" data-for="lastName">This field is required.</p>
                                <input type="text" id="lastName" name="last_name" autocomplete="family-name" placeholder="Surname">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="username">Username <span class="req" aria-hidden="true">*</span></label>
                            <p class="field-hint" data-for="username">This field is required.</p>
                            <input type="text" id="username" name="username" autocomplete="username" placeholder="Username">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email address <span class="req" aria-hidden="true">*</span></label>
                    <p class="field-hint" data-for="email">This field is required.</p>
                    <input type="email" id="email" autocomplete="email" placeholder="Enter your email">
                </div>

                <div class="signup-fields">
                    <div class="signup-fields-inner">
                        <div class="form-group">
                            <label for="phone">Phone number <span class="optional">(Optional)</span></label>
                            <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" placeholder="+60 12 345 6789" maxlength="20">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password <span class="req" aria-hidden="true">*</span></label>
                    <p class="field-hint" data-for="password">This field is required.</p>
                    <div class="password-wrap">
                        <input type="password" id="password" autocomplete="new-password" placeholder="Enter your password" minlength="8">
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
                            <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg id="eyeClosed" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a17.3 17.3 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a17.4 17.4 0 0 1-3.16 4.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">Sign up <span class="arrow" aria-hidden="true">▸</span></button>
            </form>

            <div class="toggle-link">
                <span id="toggleText">Already have an account? </span>
                <a href="?mode=login" id="toggleLink">Sign in</a>
            </div>
            </div>
            <div class="auth-result" id="authResult" aria-live="polite">
                <div class="auth-mark" aria-hidden="true">
                    <span class="auth-ring"></span>
                    <svg class="auth-check-svg" viewBox="0 0 96 96">
                        <circle class="auth-track" cx="48" cy="48" r="36"></circle>
                        <path class="auth-check" d="M32 50l11 11 21-22"></path>
                    </svg>
                </div>
                <p class="auth-result-label" id="authResultLabel"></p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.ROKA_API_BASE || 'https://api.roka-prune.com';
        let isLoginMode = false;

        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const submitBtn = document.getElementById('submitBtn');
        const toggleText = document.getElementById('toggleText');
        const toggleLink = document.getElementById('toggleLink');
        const errorDiv = document.getElementById('error');
        const authCard = document.getElementById('authCard');
        const authResultLabel = document.getElementById('authResultLabel');
        const signupInputs = ['firstName', 'lastName', 'username'].map((id) => document.getElementById(id));
        const passwordInput = document.getElementById('password');
        const params = new URLSearchParams(window.location.search);
        const nextParam = params.get('next') || '';
        const safeNext = (nextParam.startsWith('/') && !nextParam.startsWith('//') && !nextParam.includes('\\'))
            ? nextParam
            : '/dashboard.html';
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const FORM_STORE = 'roka-auth-form';

        function persistForm() {
            try {
                sessionStorage.setItem(FORM_STORE, JSON.stringify({
                    mode: isLoginMode ? 'login' : 'signup',
                    firstName: document.getElementById('firstName').value,
                    lastName: document.getElementById('lastName').value,
                    username: document.getElementById('username').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                }));
            } catch {
                /* private mode */
            }
        }

        function restoreForm() {
            try {
                const raw = sessionStorage.getItem(FORM_STORE);
                if (!raw) return;
                const saved = JSON.parse(raw);
                if (saved.firstName) document.getElementById('firstName').value = saved.firstName;
                if (saved.lastName) document.getElementById('lastName').value = saved.lastName;
                if (saved.username) document.getElementById('username').value = saved.username;
                if (saved.email) document.getElementById('email').value = saved.email;
                if (saved.phone) document.getElementById('phone').value = saved.phone;
            } catch {
                /* ignore */
            }
        }

        function friendlyError(error) {
            const message = String(error && error.message ? error.message : error || '');
            if (/load failed|failed to fetch|networkerror|network error/i.test(message)) {
                return 'Could not reach the server. Please try again.';
            }
            return message || 'Authentication failed';
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function hintFor(id) {
            return document.querySelector('.field-hint[data-for="' + id + '"]');
        }

        function setFieldInvalid(input, message) {
            const group = input.closest('.form-group');
            if (group) group.classList.add('invalid');
            const hint = hintFor(input.id);
            if (hint) hint.textContent = message;
            input.setAttribute('aria-invalid', 'true');
        }

        function clearFieldInvalid(input) {
            const group = input.closest('.form-group');
            if (group) group.classList.remove('invalid');
            const hint = hintFor(input.id);
            if (hint) hint.textContent = 'This field is required.';
            input.removeAttribute('aria-invalid');
        }

        function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        function showBusy() {
            document.documentElement.dataset.auth = 'pending';
            authCard.classList.add('is-busy');
            authCard.classList.remove('is-done');
            authResultLabel.textContent = '';
        }

        async function showSuccess(message) {
            showBusy();
            await sleep(reduceMotion ? 80 : 720);
            authCard.classList.add('is-done');
            authResultLabel.textContent = message;
            await sleep(reduceMotion ? 400 : 1400);
        }

        function hideBusy() {
            authCard.classList.remove('is-busy', 'is-done');
            delete document.documentElement.dataset.auth;
            authResultLabel.textContent = '';
        }

        async function finishAuth(token, message) {
            localStorage.setItem('roka_access_token', token);
            await showSuccess(message);
            window.location.replace(safeNext);
        }

        function oauthUrl(provider) {
            const query = new URLSearchParams({ next: safeNext });
            return `${API_BASE}/auth/oauth/${provider}?${query.toString()}`;
        }

        document.getElementById('githubOAuth').href = oauthUrl('github');
        document.getElementById('googleOAuth').href = oauthUrl('google');

        ['githubOAuth', 'googleOAuth'].forEach((id) => {
            document.getElementById(id).addEventListener('click', () => {
                persistForm();
            });
        });

        window.addEventListener('pageshow', () => {
            if (/(?:[#?&])token=/.test(location.href)) return;
            hideBusy();
            submitBtn.disabled = false;
            restoreForm();
        });

        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const oauthToken = hashParams.get('token') || params.get('token');
        const oauthError = params.get('error');
        if (oauthError) {
            hideBusy();
            showError(oauthError.replace(/\+/g, ' '));
            history.replaceState(null, '', window.location.pathname + (nextParam ? `?next=${encodeURIComponent(nextParam)}` : ''));
        }
        if (oauthToken) {
            finishAuth(oauthToken, isLoginMode || params.get('mode') === 'login'
                ? 'Signed in successfully'
                : 'Registered successfully');
        }

        function applyMode(animate) {
            document.documentElement.dataset.mode = isLoginMode ? 'login' : 'signup';
            formTitle.textContent = isLoginMode ? 'Sign in' : 'Create your account';
            formSubtitle.textContent = isLoginMode
                ? 'Welcome back to Roka'
                : 'Welcome! Please fill in the details to get started.';
            submitBtn.innerHTML = (isLoginMode ? 'Sign in' : 'Sign up') + ' <span class="arrow" aria-hidden="true">▸</span>';
            document.title = isLoginMode ? 'Sign in — Roka' : 'Sign up — Roka';
            toggleText.textContent = isLoginMode ? "Don't have an account? " : 'Already have an account? ';
            toggleLink.textContent = isLoginMode ? 'Sign up' : 'Sign in';
            toggleLink.setAttribute('href', isLoginMode ? '?mode=signup' : '?mode=login');
            passwordInput.autocomplete = isLoginMode ? 'current-password' : 'new-password';
            signupInputs.forEach((input) => {
                input.required = !isLoginMode;
            });
            if (!animate) return;
            formTitle.style.opacity = '0';
            formSubtitle.style.opacity = '0';
            requestAnimationFrame(() => {
                formTitle.style.transition = 'opacity 0.28s ease';
                formSubtitle.style.transition = 'opacity 0.28s ease';
                formTitle.style.opacity = '1';
                formSubtitle.style.opacity = '1';
            });
        }

        function toggleMode(nextIsLogin) {
            isLoginMode = nextIsLogin;
            applyMode(true);
            if (!oauthError) errorDiv.classList.add('hidden');
            const next = new URLSearchParams(window.location.search);
            if (isLoginMode) next.set('mode', 'login');
            else next.delete('mode');
            const qs = next.toString();
            history.replaceState(null, '', window.location.pathname + (qs ? `?${qs}` : ''));
        }

        if (params.get('mode') === 'login') {
            isLoginMode = true;
        }
        applyMode(false);
        restoreForm();
        if (!oauthToken) hideBusy();

        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            toggleMode(!isLoginMode);
        });

        document.getElementById('togglePassword').addEventListener('click', () => {
            const show = passwordInput.type === 'password';
            passwordInput.type = show ? 'text' : 'password';
            document.getElementById('eyeOpen').classList.toggle('hidden', show);
            document.getElementById('eyeClosed').classList.toggle('hidden', !show);
            document.getElementById('togglePassword').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });

        const phoneInput = document.getElementById('phone');

        function phoneDigits(value) {
            return String(value || '').replace(/\D/g, '').slice(0, 15);
        }

        function formatPhoneDisplay(value) {
            const digits = phoneDigits(value);
            const hadPlus = String(value || '').includes('+');
            if (!digits) return hadPlus ? '+' : '';
            const parts = [];
            for (let i = 0; i < digits.length; i += 3) {
                parts.push(digits.slice(i, i + 3));
            }
            return '+' + parts.join(' ');
        }

        function formatPhoneE164(value) {
            const digits = phoneDigits(value);
            return digits ? `+${digits}` : '';
        }

        phoneInput.addEventListener('focus', () => {
            if (!phoneInput.value.trim()) phoneInput.value = '+';
        });

        phoneInput.addEventListener('blur', () => {
            if (phoneInput.value.trim() === '+') phoneInput.value = '';
        });

        phoneInput.addEventListener('input', () => {
            const formatted = formatPhoneDisplay(phoneInput.value);
            phoneInput.value = formatted;
            phoneInput.setSelectionRange(formatted.length, formatted.length);
        });

        phoneInput.addEventListener('keydown', (e) => {
            if (e.key !== 'Backspace') return;
            if (phoneDigits(phoneInput.value).length === 0) {
                e.preventDefault();
                phoneInput.value = '';
            }
        });

        function validateForm() {
            const emailInput = document.getElementById('email');
            const fields = isLoginMode
                ? [emailInput, passwordInput]
                : [document.getElementById('firstName'), document.getElementById('lastName'), document.getElementById('username'), emailInput, passwordInput];
            let firstInvalid = null;

            fields.forEach((input) => clearFieldInvalid(input));

            fields.forEach((input) => {
                const value = input.value.trim();
                if (!value) {
                    setFieldInvalid(input, 'This field is required.');
                    if (!firstInvalid) firstInvalid = input;
                }
            });

            const email = emailInput.value.trim();
            if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                setFieldInvalid(emailInput, 'Enter a valid email address.');
                if (!firstInvalid) firstInvalid = emailInput;
            }

            if (!isLoginMode && passwordInput.value && passwordInput.value.length < 8) {
                setFieldInvalid(passwordInput, 'Password must be at least 8 characters.');
                if (!firstInvalid) firstInvalid = passwordInput;
            }

            if (firstInvalid) {
                showError('Please fill in every required field.');
                firstInvalid.focus();
                return false;
            }
            if (!oauthError) errorDiv.classList.add('hidden');
            return true;
        }

        ['firstName', 'lastName', 'username', 'email', 'password', 'phone'].forEach((id) => {
            document.getElementById(id).addEventListener('input', (e) => {
                clearFieldInvalid(e.currentTarget);
                persistForm();
            });
        });

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!validateForm()) return;

            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;
            submitBtn.disabled = true;
            errorDiv.classList.add('hidden');
            showBusy();

            try {
                const endpoint = isLoginMode ? '/auth/login' : '/auth/signup';
                const payload = { email, password };
                if (!isLoginMode) {
                    payload.first_name = document.getElementById('firstName').value.trim();
                    payload.last_name = document.getElementById('lastName').value.trim();
                    payload.username = document.getElementById('username').value.trim();
                    payload.phone = formatPhoneE164(document.getElementById('phone').value);
                }
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const raw = await response.text();
                let data;
                try {
                    data = JSON.parse(raw);
                } catch {
                    throw new Error(raw.trim() || `Server error (${response.status})`);
                }

                if (!response.ok) {
                    const detail = data.detail || data.error;
                    const message = Array.isArray(detail)
                        ? detail.map((item) => item.msg || item).join(' ')
                        : (detail || 'Authentication failed');
                    throw new Error(message);
                }

                await finishAuth(
                    data.access_token,
                    isLoginMode ? 'Signed in successfully' : 'Registered successfully'
                );

            } catch (error) {
                hideBusy();
                errorDiv.textContent = friendlyError(error);
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
            }
        });

        if (!oauthToken) {
            const clean = new URLSearchParams(params);
            if (clean.has('welcome') || clean.has('from')) {
                clean.delete('welcome');
                clean.delete('from');
                const qs = clean.toString();
                history.replaceState(null, '', window.location.pathname + (qs ? `?${qs}` : '') + window.location.hash);
            }
        }
    </script>
</body>
</html>
