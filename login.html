    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --text: #0a0a0a;
            --text-muted: #666666;
            --border: #e5e5e5;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.1);
            --surface: #f5f5f5;
        }

        html.dark {
            --bg: #0a0a0a;
            --text: #ededed;
            --text-muted: #888888;
            --border: #262626;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --surface: #171717;
        }

        body {
            font-family: "Montserrat", sans-serif;
            font-optical-sizing: auto;
            font-weight: 375;
            font-style: normal;
            letter-spacing: -0.01em;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            font-weight: 600;
            font-size: 1.25rem;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
        }

        .card h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font-size: 0.875rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toggle-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
        }

        .toggle-link a {
            color: var(--accent);
            text-decoration: none;
        }

        .toggle-link a:hover {
            text-decoration: underline;
        }

        .oauth-stack {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1.25rem;
        }

        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .oauth-btn:hover {
            border-color: var(--text-muted);
        }

        .oauth-btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .oauth-divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .oauth-divider::before,
        .oauth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        @keyframes logoSpin {
            0% { transform: rotate(0deg) scale(1); opacity: 0; }
            50% { transform: rotate(180deg) scale(1.2); opacity: 1; }
            100% { transform: rotate(360deg) scale(1); opacity: 1; }
        }

        .logo-animate {
            animation: logoSpin 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="/assets/icons/favicon-32x32.png" alt="Roka" class="logo-animate" width="28" height="28">
            Roka
        </div>

        <div class="card">
            <h1 id="formTitle">Login</h1>
            <p id="formSubtitle">Welcome back to Roka</p>

            <div id="error" class="error hidden"></div>

            <div class="oauth-stack">
                <a class="oauth-btn" id="githubOAuth" href="#">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.1c-3.3.7-4-1.6-4-1.6-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.2-3.3-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.4 1.2a11.7 11.7 0 0 1 6.2 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.6.3 2.9.1 3.2.8.9 1.2 2 1.2 3.3 0 4.7-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A12 12 0 0 0 12 .3z"/></svg>
                    Continue with GitHub
                </a>
                <a class="oauth-btn" id="googleOAuth" href="#">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#EA4335" d="M12 10.2v3.6h5.1c-.2 1.2-1.5 3.6-5.1 3.6-3.1 0-5.6-2.5-5.6-5.6S8.9 6.2 12 6.2c1.7 0 2.9.7 3.6 1.3l2.4-2.4C16.4 3.7 14.4 2.8 12 2.8 6.9 2.8 2.8 6.9 2.8 12S6.9 21.2 12 21.2c5.3 0 8.8-3.7 8.8-8.9 0-.6-.1-1-.2-1.5H12z"/>
                        <path fill="#4285F4" d="M12 10.2v3.6h5.1c-.2 1.2-1.5 3.6-5.1 3.6-3.1 0-5.6-2.5-5.6-5.6 0-.9.2-1.7.6-2.4l-3.2-2.5C2.8 8.2 2.2 10 2.2 12c0 5.1 4.1 9.2 9.8 9.2 5.3 0 8.8-3.7 8.8-8.9 0-.6-.1-1-.2-1.5H12z" opacity=".15"/>
                        <path fill="#FBBC05" d="M6.9 14.2 3.7 16.7C4.9 19.1 8.2 21.2 12 21.2c2.4 0 4.4-.8 5.9-2.1l-2.9-2.2c-.8.6-1.8.9-3 .9-2.3 0-4.2-1.5-4.9-3.6z"/>
                        <path fill="#34A853" d="M12 6.2c1.7 0 2.9.7 3.6 1.3l2.4-2.4C16.4 3.7 14.4 2.8 12 2.8 8.2 2.8 4.9 4.9 3.7 7.3l3.2 2.5C7.8 7.7 9.7 6.2 12 6.2z"/>
                        <path fill="#4285F4" d="M20.8 12.3c0-.6-.1-1-.2-1.5H12v3.6h5.1c-.3 1.3-1.2 2.5-2.5 3.2l2.9 2.2c1.8-1.6 3.3-4 3.3-7.5z"/>
                    </svg>
                    Continue with Google
                </a>
            </div>
            <div class="oauth-divider">or email</div>

            <form id="authForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">Login</button>
            </form>

            <div class="toggle-link">
                <span id="toggleText">Don't have an account? </span>
                <a href="#" id="toggleLink">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.ROKA_API_BASE || 'https://api.roka-prune.com';
        let isLoginMode = true;

        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const submitBtn = document.getElementById('submitBtn');
        const toggleText = document.getElementById('toggleText');
        const toggleLink = document.getElementById('toggleLink');
        const errorDiv = document.getElementById('error');
        const params = new URLSearchParams(window.location.search);
        const nextParam = params.get('next') || '';
        const safeNext = (nextParam.startsWith('/') && !nextParam.startsWith('//') && !nextParam.includes('\\'))
            ? nextParam
            : '/dashboard.html';

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function oauthUrl(provider) {
            const query = new URLSearchParams({ next: safeNext });
            return `${API_BASE}/auth/oauth/${provider}?${query.toString()}`;
        }

        document.getElementById('githubOAuth').href = oauthUrl('github');
        document.getElementById('googleOAuth').href = oauthUrl('google');

        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const oauthToken = hashParams.get('token') || params.get('token');
        const oauthError = params.get('error');
        if (oauthError) {
            showError(oauthError);
            history.replaceState(null, '', window.location.pathname + (nextParam ? `?next=${encodeURIComponent(nextParam)}` : ''));
        }
        if (oauthToken) {
            localStorage.setItem('roka_access_token', oauthToken);
            window.location.replace(safeNext);
        }
        function applyMode() {
            if (isLoginMode) {
                formTitle.textContent = 'Login';
                formSubtitle.textContent = 'Welcome back to Roka';
                submitBtn.textContent = 'Login';
                toggleText.textContent = "Don't have an account? ";
                toggleLink.textContent = 'Sign up';
            } else {
                formTitle.textContent = 'Sign up';
                formSubtitle.textContent = 'Create your Roka account';
                submitBtn.textContent = 'Sign up';
                toggleText.textContent = 'Already have an account? ';
                toggleLink.textContent = 'Login';
            }
        }

        function toggleMode() {
            isLoginMode = !isLoginMode;
            applyMode();
            if (!oauthError) errorDiv.classList.add('hidden');
        }

        if (params.get('mode') === 'signup') {
            isLoginMode = false;
            applyMode();
        }

        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            toggleMode();
        });

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            submitBtn.disabled = true;
            errorDiv.classList.add('hidden');

            try {
                const endpoint = isLoginMode ? '/auth/login' : '/auth/signup';
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const raw = await response.text();
                let data;
                try {
                    data = JSON.parse(raw);
                } catch {
                    throw new Error(raw.trim() || `Server error (${response.status})`);
                }

                if (!response.ok) {
                    throw new Error(data.detail || data.error || 'Authentication failed');
                }

                localStorage.setItem('roka_access_token', data.access_token);
                const next = new URLSearchParams(window.location.search).get('next') || '';
                window.location.href = (next.startsWith('/') && !next.startsWith('//') && !next.includes('\\'))
                    ? next
                    : '/dashboard.html';

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
